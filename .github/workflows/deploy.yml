name: Check and Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check:
    name: Check website files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check required files and HTML title
        shell: bash
        run: |
          set -e
          test -f index.html || { echo "ERROR: Missing index.html"; exit 1; }
          test -f style.css || { echo "ERROR: Missing style.css"; exit 1; }
          test -f script.js || { echo "ERROR: Missing script.js"; exit 1; }
          grep -Eiq '<title[^>]*>[^<]+' index.html || { echo "ERROR: index.html must contain a non-empty <title> tag"; exit 1; }
          echo "OK: Found index.html, style.css, script.js, and a non-empty title."

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
